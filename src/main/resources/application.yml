spring:
  application:
    name: test

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC 드라이버 클래스 이름
    url: jdbc:mysql://localhost:3306/test1?serverTimezone=Asia/Seoul
    username: root
    password: 12345678

  jpa:
    database: mysql # 사용할 DB 유형 지정 (MySQL)
    database-platform: org.hibernate.dialect.MySQLDialect # Hibernate에서 사용할 MySQL 방언(dialect) 지정
    show-sql: true # 실행된 SQL 쿼리를 콘솔에 출력할지 여부
    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 DB 스키마의 상태 설정
    properties:
      hibernate:
        format_sql: true # 출력되는 SQL 쿼리를 보기 좋게 포맷팅
  spring:
    jwt:
      secret: ${JWT_SECRET} # JWT 시크릿 키
      token:
        access-expiration-time: ${JWT_ACCESS_EXPIRATION}  # Access Token 만료 시간
        refresh-expiration-time: ${JWT_ACCESS_EXPIRATION}  #  Refresh Token 만료 시간
    security:
      oauth2:
        client:
          registration:
            kakao:
              authorization-grant-type: authorization_code
              client-id: ${API_KEY}
              redirect-uri: ${REDIRECT_URI}
              client-authentication-method: client_secret_post
              scope:
                - profile_nickname
                - profile_image
                - profile_email
          provider:
            kakao:
              authorization-uri: https://kauth.kakao.com/oauth/authorize
              token-uri: https://kauth.kakao.com/oauth/token
              user-info-uri: https://kapi.kakao.com/v2/user/me
              user-name-attribute: id
  airkorea:
    service-key: gC3iWj2EfzQMMLVRORT5ecvxJ370Y/4gR8N3A9miRKeMJi0SiYNqLTVyVesGQqGIREPBEB3m3CbL5TroUDTiHA==
